document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

thumb{background:oklch(0.4 0.01 285);border-radius:6px;}\n@keyframes ccfade{from{opacity:0;transform:translateY(10px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}\n@keyframes ccscrim{from{opacity:0;}to{opacity:1;}}\n@keyframes ccbloom{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}\n@keyframes ccin{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div ref=\"{{ rootRef }}\" style=\"position:relative; min-height:100vh; width:100%; font-family:Onest,sans-serif; color:oklch(0.95 0.005 285); overflow-x:hidden; --accent:oklch(0.62 0.19 280); {{ appBg }}\">\n\n  <!-- TOP BAR -->\n  <div style=\"position:fixed; top:0; left:0; right:0; height:58px; z-index:40; display:flex; align-items:center; justify-content:space-between; padding:0 22px; background:color-mix(in oklch, oklch(0.17 0.006 285) 88%, transparent); backdrop-filter:blur(12px); border-bottom:1px solid oklch(0.26 0.008 285);\">\n    <div style=\"display:flex; align-items:center; gap:13px;\">\n      <a href=\"Hub.dc.html\" style=\"display:flex; align-items:center; gap:6px; text-decoration:none; color:oklch(0.6 0.01 285); font-size:12.5px; font-weight:500;\">← All directions<\u002Fa>\n      <div style=\"width:1px; height:18px; background:oklch(0.3 0.01 285);\"><\u002Fdiv>\n      <span style=\"font-size:11px; font-weight:700; letter-spacing:.04em; color:var(--accent); background:color-mix(in oklch, var(--accent) 13%, transparent); padding:3px 8px; border-radius:6px;\">PEEL + EJECT<\u002Fspan>\n      <span style=\"font-size:13.5px; color:oklch(0.78 0.01 285); font-weight:500;\">Pixels &amp; Pints<\u002Fspan>\n      <span style=\"{{ statusPillStyle }}\">{{ statusLabel }}<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex; align-items:center; gap:12px;\">\n      <div style=\"display:flex; gap:3px; background:oklch(0.20 0.007 285); border:1px solid oklch(0.30 0.01 285); border-radius:9px; padding:3px;\">\n        <button onclick=\"{{ clickSimpleSeg }}\" style=\"{{ segSimpleStyle }}\">{{ simpleSegLabel }}<\u002Fbutton>\n        <button onclick=\"{{ clickBuilderSeg }}\" style=\"{{ segBuilderStyle }}\">Builder<\u002Fbutton>\n      <\u002Fdiv>\n      <button style=\"padding:7px 15px; border:none; background:var(--accent); color:#fff; border-radius:8px; font-family:Onest; font-size:13px; font-weight:600; cursor:pointer;\">Publish<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- LEFT RAIL · layers + add (builder) -->\n  <div style=\"{{ leftRailStyle }}\">\n    <div style=\"display:flex; align-items:center; justify-content:space-between; padding:2px 6px 10px;\">\n      <span style=\"font-size:11px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:oklch(0.6 0.01 285);\">Blocks<\u002Fspan>\n    <\u002Fdiv>\n    <sc-for list=\"{{ blockVMs }}\" as=\"b\" hint-placeholder-count=\"8\">\n      <div onclick=\"{{ b.onSelect }}\" style=\"{{ b.railStyle }}\">\n        <span style=\"width:5px; height:5px; border-radius:1px; background:currentColor; opacity:.5;\"><\u002Fspan>\n        <span style=\"flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;\">{{ b.label }}<\u002Fspan>\n        <sc-if value=\"{{ b.isCustom }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:9px; font-weight:700; letter-spacing:.03em; color:var(--accent);\">NEW<\u002Fspan><\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n    <button onclick=\"{{ openAdd }}\" style=\"width:100%; margin-top:9px; display:flex; align-items:center; justify-content:center; gap:6px; padding:9px; border:1px dashed color-mix(in oklch, var(--accent) 45%, transparent); border-radius:9px; background:color-mix(in oklch, var(--accent) 9%, transparent); color:var(--accent); font-family:Onest; font-size:12.5px; font-weight:600; cursor:pointer;\">+ Add block<\u002Fbutton>\n  <\u002Fdiv>\n\n  <!-- RIGHT RAIL · properties (builder) -->\n  <div style=\"{{ rightRailStyle }}\">\n you see, with a lot more power. It opens right in place; nothing is rebuilt or migrated.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex; gap:14px; padding:22px 28px;\">\n          <div style=\"flex:1; background:oklch(0.18 0.006 285); border:1px solid oklch(0.28 0.01 285); border-radius:13px; padding:15px;\">\n            <div style=\"font-size:11.5px; font-weight:700; letter-spacing:.04em; color:oklch(0.62 0.16 150); margin-bottom:11px;\">COMES WITH YOU<\u002Fdiv>\n            <sc-for list=\"{{ carryItems }}\" as=\"c\" hint-placeholder-count=\"6\">\n              <div style=\"display:flex; align-items:center; gap:8px; padding:4px 0; font-size:13px; color:oklch(0.82 0.01 285);\"><span style=\"width:15px; height:15px; border-radius:50%; background:color-mix(in oklch, oklch(0.62 0.16 150) 20%, transparent); color:oklch(0.7 0.16 150); font-size:9px; display:flex; align-items:center; justify-content:center; flex-shrink:0;\">✓<\u002Fspan>{{ c.label }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"flex:1; background:color-mix(in oklch, var(--accent) 7%, transparent); border:1px solid color-mix(in oklch, var(--accent) 25%, transparent); border-radius:13px; padding:15px;\">\n            <div style=\"font-size:11.5px; font-weight:700; letter-spacing:.04em; color:var(--accent); margin-bottom:11px;\">YOU UNLOCK<\u002Fdiv>\n            <div style=\"display:flex; align-items:center; gap:8px; padding:4px 0; font-size:13px; color:oklch(0.88 0.01 285);\"><span style=\"color:var(--accent);\">＋<\u002Fspan>Custom blocks — gallery, sponsors, FAQ, map…<\u002Fdiv>\n            <div style=\"display:flex; align-items:center; gap:8px; padding:4px 0; font-size:13px; color:oklch(0.88 0.01 285);\"><span style=\"color:var(--accent);\">＋<\u002Fspan>Drag-and-drop layout &amp; sections<\u002Fdiv>\n            <div style=\"display:flex; align-items:center; gap:8px; padding:4px 0; font-size:13px; color:oklch(0.88 0.01 285);\"><span style=\"color:var(--accent);\">＋<\u002Fspan>Conditional logic on questions<\u002Fdiv>\n            <div style=\"display:flex; align-items:center; gap:8px; padding:4px 0; font-size:13px; color:oklch(0.88 0.01 285);\"><span style=\"color:var(--accent);\">＋<\u002Fspan>Your branding, fonts &amp; colors<\u002Fdiv>\n            <div style=\"display:flex; align-items:center; gap:8px; padding:4px 0; font-size:13px; color:oklch(0.88 0.01 285);\"><span style=\"color:var(--accent);\">＋<\u002Fspan>Contact database &amp; email<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"margin:0 28px; padding:14px 16px; background:color-mix(in oklch, oklch(0.6 0.14 65) 8%, transparent); border:1px solid color-mix(in oklch, oklch(0.65 0.13 65) 30%, transparent); border-radius:13px;\">\n          <div style=\"display:flex; align-items:center; gap:8px; margin-bottom:8px;\"><div style=\"width:18px;height:18px;border-radius:50%;border:1.5px solid oklch(0.68 0.13 65);color:oklch(0.78 0.13 65);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;\">!<\u002Fdiv><span style=\"font-size:13px; font-weight:600; color:oklch(0.82 0.08 70);\">This is a one-way move<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:12.5px; line-height:1.55; color:oklch(0.74 0.04 75);\">Once you add builder-only blocks or layout, the simple editor can no longer describe your page — so you won’t be able to switch back to it. (You can always duplicate this event to start a fresh simple one.)<\u002Fdiv>\n          <label style=\"display:flex; align-items:center; gap:10px; margin-top:12px; cursor:pointer;\">\n            <div onclick=\"{{ toggleAck }}\" style=\"{{ ackBoxStyle }}\"><sc-if value=\"{{ ack }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"color:#fff; font-size:12px;\">✓<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n            <span style=\"font-size:12.5px; color:oklch(0.85 0.01 285);\">I understand this event will move to the builder for good.<\u002Fspan>\n          <\u002Flabel>\n        <\u002Fdiv>\n\n        <div style=\"display:flex; gap:10px; padding:20px 28px 24px;\">\n          <button onclick=\"{{ closeUpgrade }}\" style=\"flex:1; padding:13px; border:1px solid oklch(0.32 0.01 285); background:transparent; color:oklch(0.85 0.01 285); border-radius:11px; font-family:Onest; font-size:14px; font-weight:500; cursor:pointer;\">Stay simple<\u002Fbutton>\n          <button onclick=\"{{ confirmUpgrade }}\" style=\"{{ confirmBtnStyle }}\">Upgrade &amp; open builder →<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ADD BLOCK LIBRARY -->\n  <sc-if value=\"{{ addOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed; inset:0; z-index:60; background:oklch(0.1 0.006 285 / .6); display:flex; align-items:center; justify-content:center; padding:24px; animation:ccscrim .25s ease;\" onclick=\"{{ closeAdd }}\">\n      <div onclick=\"{{ stop }}\" style=\"width:520px; max-width:100%; background:oklch(0.205 0.007 285); border:1px solid oklch(0.3 0.01 285); border-radius:18px; padding:22px; box-shadow:0 28px 70px oklch(0 0 0 / .55); animation:ccfade .3s ease;\">\n        <div style=\"display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;\">\n          <div style=\"font-size:17px; font-weight:600;\">Add a block<\u002Fdiv>\n          <button onclick=\"{{ closeAdd }}\" style=\"background:none; border:none; color:oklch(0.6 0.01 285); font-size:19px; cursor:pointer;\">×<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:11px;\">\n          <sc-for list=\"{{ addables }}\" as=\"a\" hint-placeholder-count=\"4\">\n            <div onclick=\"{{ a.onClick }}\" style=\"border:1px solid oklch(0.3 0.01 285); border-radius:12px; padding:14px; cursor:pointer; background:oklch(0.185 0.006 285); transition:border-color .15s;\" style-hover=\"border-color:color-mix(in oklch, var(--accent) 55%, transparent); background:oklch(0.22 0.007 285);\">\n              <div style=\"font-size:14px; font-weight:600; color:oklch(0.95 0.01 285); margin-bottom:4px;\">{{ a.label }}<\u002Fdiv>\n              <div style=\"font-size:12px; color:oklch(0.6 0.01 285); line-height:1.45;\">{{ a.desc }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- LOCK EXPLAINER (irreversibility) -->\n  <sc-if value=\"{{ lockMsgOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed; inset:0; z-index:60; background:oklch(0.1 0.006 285 / .62); display:flex; align-items:center; justify-content:center; animation:ccscrim .25s ease;\" onclick=\"{{ closeLockMsg }}\">\n      <div onclick=\"{{ stop }}\" style=\"width:420px; max-width:calc(100vw - 40px); background:oklch(0.21 0.007 285); border:1px solid oklch(0.3 0.01 285); border-radius:18px; padding:24px; box-shadow:0 28px 70px oklch(0 0 0 / .55); animation:ccfade .32s ease;\">\n        <div style=\"display:flex; align-items:center; gap:9px; margin-bottom:11px;\"><div style=\"width:30px;height:30px;border-radius:9px;background:oklch(0.26 0.01 285);display:flex;align-items:center;justify-content:center;\"><div style=\"position:relative; width:13px; height:11px;\"><div style=\"position:absolute; bottom:0; left:0; right:0; height:8px; background:oklch(0.75 0.01 285); border-radius:2px;\"><\u002Fdiv><div style=\"position:absolute; top:0; left:50%; transform:translateX(-50%); width:8px; height:8px; border:2px solid oklch(0.75 0.01 285); border-bottom:none; border-radius:4px 4px 0 0;\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"font-size:17px; font-weight:700;\">Can’t go back to simple<\u002Fdiv><\u002Fdiv>\n        <div style=\"font-size:13.5px; line-height:1.6; color:oklch(0.74 0.01 285);\">This event now lives in the builder. The simple editor only understands the blocks it can generate — it has no way to show your custom layout and blocks without dropping them. So the move is one-way by design.<\u002Fdiv>\n        <div style=\"font-size:13px; line-height:1.55; color:oklch(0.62 0.01 285); margin-top:12px;\">Need a simple version too? <b style=\"color:oklch(0.88 0.01 285);\">Duplicate<\u002Fb> this event and the copy starts fresh in the simple editor.<\u002Fdiv>\n        <button onclick=\"{{ closeLockMsg }}\" style=\"width:100%; margin-top:18px; padding:12px; border:none; border-radius:11px; background:var(--accent); color:#fff; font-family:Onest; font-size:14px; font-weight:600; cursor:pointer;\">Got it<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- toast -->\n  <sc-if value=\"{{ toastOn }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed; left:50%; top:70px; transform:translateX(-50%); z-index:45; display:flex; align-items:center; gap:9px; padding:11px 16px; background:oklch(0.24 0.008 285); border:1px solid oklch(0.33 0.01 285); border-radius:11px; box-shadow:0 10px 30px oklch(0 0 0 / .4); animation:ccin .4s ease;\">\n      <div style=\"width:16px;height:16px;border-radius:50%;background:oklch(0.62 0.16 150);display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;\">✓<\u002Fdiv>\n      <span style=\"font-size:13px; color:oklch(0.85 0.01 285);\">Upgraded — your whole event came across.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1360,&quot;height&quot;:880},&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;oklch(0.62 0.19 280)&quot;,&quot;options&quot;:[&quot;oklch(0.62 0.19 280)&quot;,&quot;oklch(0.60 0.21 300)&quot;,&quot;oklch(0.66 0.12 195)&quot;,&quot;oklch(0.68 0.16 35)&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;showHints&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nclass Component extends DCLogic {\n  rootRef = React.createRef();\n  state = {\n    phase:'simple', upgradeOpen:false, ack:false, addOpen:false, lockMsgOpen:false,\n    toastOn:false, builderHintDismissed:false, selected:null, hover:null,\n    fields:{ title:'Pixels & Pints', tagline:'A summer mixer for people who design and build.' },\n    blocks:[\n      {id:'cover', type:'cover'}, {id:'header', type:'header'}, {id:'hosts', type:'hosts'},\n      {id:'meta', type:'meta'}, {id:'desc', type:'desc'}, {id:'schedule', type:'schedule'},\n      {id:'tickets', type:'tickets'}, {id:'questions', type:'questions'}\n    ],\n    nextId:1\n  };\n\n  componentDidMount(){\n    if(this.rootRef.current) this.rootRef.current.style.setProperty('--accent', this.props.accentColor || 'oklch(0.62 0.19 280)');\n    this._onVis = () => this.forceUpdate();\n    if(typeof document !== 'undefined') document.addEventListener('visibilitychange', this._onVis);\n  }\n  componentWillUnmount(){ if(this._onVis && typeof document!=='undefined') document.removeEventListener('visibilitychange', this._onVis); }\n\n  openUpgrade(){ this.setState({ upgradeOpen:true, ack:false }); }\n  closeUpgrade(){ this.setState({ upgradeOpen:false }); }\n  toggleAck(){ this.setState(s => ({ ack: !s.ack })); }\n  confirmUpgrade(){\n    if(!this.state.ack) return;\n    this.setState({ upgradeOpen:false, phase:'builder', selected:'header', toastOn:true });\n    clearTimeout(this._t); this._t = setTimeout(() => this.setState({ toastOn:false }), 3000);\n  }\n  clickSimpleSeg(){ if(this.state.phase==='builder') this.setState({ lockMsgOpen:true }); }\n  clickBuilderSeg(){ if(this.state.phase==='simple') this.openUpgrade(); }\n  closeLockMsg(){ this.setState({ lockMsgOpen:false }); }\n  openAdd(){ this.setState({ addOpen:true }); }\n  closeAdd(){ this.setState({ addOpen:false }); }\n  addBlock(type){ const id = 'x'+this.state.nextId; this.setState(s => ({ blocks: s.blocks.concat([{id, type}]), nextId: s.nextId+1, selected:id, addOpen:false })); }\n  removeBlock(id){ this.setState(s => ({ blocks: s.blocks.filter(b => b.id!==id), selected: s.selected===id?null:s.selected })); }\n  selectBlock(id){ if(this.state.phase==='builder') this.setState({ selected:id }); }\n  setHover(id){ if(this.state.phase==='builder' && this.state.hover!==id) this.setState({ hover:id }); }\n  clearHover(){ if(this.state.hover) this.setState({ hover:null }); }\n  setField(k, v){ this.setState(s => ({ fields: Object.assign({}, s.fields, { [k]:v }) })); }\n\n  renderVals(){\n    const docHidden = typeof document !== 'undefined' && document.hidden;\n    const isBuilder = this.state.phase === 'builder';\n    const isSimple = !isBuilder;\n    const labels = { cover:'Cover', header:'Title', hosts:'Hosts', meta:'Date & location', desc:'About', schedule:'Schedule', tickets:'Tickets', questions:'Questions', gallery:'Photo gallery', sponsors:'Sponsors', faq:'FAQ', map:'Getting there' };\n    const customTypes = { gallery:1, sponsors:1, faq:1, map:1 };\n    const sel = this.state.selected;\n\n    const blockVMs = this.state.blocks.map(b => {\n      const t = b.type;\n      const selected = sel === b.id && isBuilder;\n      const hov = this.state.hover === b.id && isBuilder;\n      const isCustom = !!customTypes[t];\n      return {\n        id:b.id, label:labels[t], isCustom,\n        isCover:t==='cover', isHeader:t==='header', isHosts:t==='hosts', isMeta:t==='meta',\n        isDesc:t==='desc', isSchedule:t==='schedule', isTickets:t==='tickets', isQuestions:t==='questions',\n        isGallery:t==='gallery', isSponsors:t==='sponsors', isFaq:t==='faq', isMap:t==='map',\n        chromeShow: isBuilder && (selected || hov),\n        wrapStyle: {\n          position:'relative',\n          padding: t==='cover' ? 0 : '13px 22px',\n          margin: t==='cover' ? '0 0 4px' : '2px 0',\n          borderRadius: t==='cover' ? '16px 16px 10px 10px' : 12,\n          border: '2px solid ' + (selected ? 'var(--accent)'
